[project]
name = "summer3proto"
version = "0.1.0"
description = "summer3 prototype"
authors = ["David Shipman <dshipman@gmail.com>"]
channels = ["conda-forge"]
platforms = ["win-64"]

[dependencies]
python = ">=3.11"
ipykernel = ">=6.29.5,<6.30"
# matplotlib = ">=3.9.3,<3.10"
jupyter = ">=1.1.1,<1.2"
ipywidgets = ">=8.1.5,<8.2"
# arviz = ">=0.20.0,<0.21"
# plotly = ">=5.24.1,<5.25"
pygraphviz = ">=1.14,<2"
plotly = ">=6.3.0,<7"

[pypi-dependencies]
summer3 = { path = "./code", editable = true }
computegraph = { git = "https://github.com/monash-emu/computegraph.git", rev = "c425e3ba4632b8b8f8a622d381390dba25637089"}
numpy = ">=2.2.0,<2.3"
pandas = ">=2.2.3,<2.4"
numpyro = ">=0.16.1,<0.17"
blackjax = ">=1.2.4,<1.3"
jaxtyping = ">=0.2.36,<0.3"
typeguard = ">=2.13.3,<2.14"
diffrax = "==0.6.2"
jax = "==0.4.38"
jaxlib = "==0.4.38"
jax-dataclasses = ">=1.6.2,<2"
optimistix = ">=0.0.10, <0.0.11"
arviz = ">=0.22.0, <0.23"

[feature.test.dependencies]
pytest = "*"

[feature.test.tasks]
test = "pytest"

[environments]
test = ["test"]
